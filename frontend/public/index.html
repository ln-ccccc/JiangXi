<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071923">
    <link rel="icon" type="image/svg+xml" href="<%= BASE_URL %>logo.svg">
    <title>江西生态图册｜解译与指数分析</title>
  </head>
  <body>
    <noscript>
      <strong>江西生态图册需要启用 JavaScript。请启用后刷新页面，继续进入地物分类或光谱指数工作流。</strong>
    </noscript>
    <div id="app">
      <div class="atlas-loader" role="status" aria-live="polite">
        <div class="loader-contours" aria-hidden="true"></div>
        <div class="loader-record">
          <div class="loader-scale" aria-hidden="true"></div>
          <span class="loader-label">JIANGXI · FIELD ATLAS</span>
          <strong>江西生态图册</strong>
          <span>正在载入解译与指数分析工作台…</span>
        </div>
      </div>
    </div>
  </body>
</html>

<style>
  :root {
    --jx-loader-bg: #071923;
    --jx-loader-surface: #0d2630;
    --jx-loader-border: rgba(156, 231, 189, 0.22);
    --jx-loader-border-strong: rgba(156, 231, 189, 0.5);
    --jx-loader-text: #e5f1ed;
    --jx-loader-muted: #9bb0ab;
    --jx-loader-primary: #9ce7bd;
    --jx-loader-sand: #e6c98c;
  }

  html,
  body,
  #app {
    min-height: 100%;
    margin: 0;
    background: var(--jx-loader-bg);
  }

  .atlas-loader {
    position: fixed;
    inset: 0;
    display: grid;
    overflow: hidden;
    place-items: center;
    background: var(--jx-loader-bg);
    color: var(--jx-loader-text);
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
  }

  .loader-contours {
    position: absolute;
    inset: 0;
    opacity: 0.16;
    background: repeating-radial-gradient(
      ellipse at 50% 50%,
      transparent 0 28px,
      var(--jx-loader-border) 29px 30px,
      transparent 31px 50px
    );
    animation: atlas-breathe 2.4s ease-in-out infinite;
  }

  .loader-record {
    position: relative;
    display: grid;
    width: min(420px, calc(100vw - 40px));
    padding: 30px;
    gap: 7px;
    border: 1px solid var(--jx-loader-border);
    border-radius: 16px;
    background: var(--jx-loader-surface);
  }

  .loader-scale {
    height: 8px;
    margin-bottom: 14px;
    border-top: 1px solid var(--jx-loader-border-strong);
    background: repeating-linear-gradient(
      90deg,
      var(--jx-loader-border-strong) 0 1px,
      transparent 1px 12px
    );
  }

  .loader-label {
    color: var(--jx-loader-sand) !important;
    font-family: Bahnschrift, "DIN Alternate", Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
  }

  .loader-record strong {
    color: var(--jx-loader-text);
    font-family: "Noto Serif SC", "Source Han Serif SC", STSong, serif;
    font-size: 30px;
    font-weight: 600;
  }

  .loader-record span:last-child {
    color: var(--jx-loader-muted);
    font-size: 13px;
  }

  @keyframes atlas-breathe {
    50% {
      opacity: 0.08;
    }
  }

  @media (max-width: 480px) {
    .loader-record {
      padding: 24px 20px;
    }

    .loader-record strong {
      font-size: 26px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .loader-contours {
      animation: none;
    }
  }
</style>
